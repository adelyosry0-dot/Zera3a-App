<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3B6D11">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>سجل الحيازات الزراعية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #3B6D11; --green-light: #EAF3DE; --green-mid: #639922;
  --amber: #BA7517; --amber-light: #FAEEDA;
  --red: #A32D2D; --red-light: #FCEBEB;
  --blue: #185FA5; --blue-light: #E6F1FB;
  --surface: #ffffff; --surface2: #f5f5f0;
  --border: rgba(0,0,0,0.12); --text: #1a1a1a; --muted: #666;
  --radius: 10px; --radius-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1c1e; --surface2: #2c2c2e;
    --border: rgba(255,255,255,0.12); --text: #f0f0f0; --muted: #aaa;
    --green-light: #1a2e0a; --amber-light: #2a1e08;
    --red-light: #2e0f0f; --blue-light: #0a1e35;
  }
}
html, body { height: 100%; background: var(--surface2); font-family: -apple-system, 'Segoe UI', Arial, sans-serif; color: var(--text); }
#app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--surface2); }

/* Header */
.header { background: var(--green); color: #fff; padding: 16px 16px 12px; padding-top: max(16px, env(safe-area-inset-top)); flex-shrink: 0; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.header h1 { font-size: 18px; font-weight: 600; }
.header-sub { font-size: 12px; opacity: 0.8; }
.header-btns { display: flex; gap: 8px; }
.btn-add { background: #fff; color: var(--green); border: none; border-radius: var(--radius); padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-excel { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.5); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }

/* Toolbar */
.toolbar { background: var(--surface); padding: 10px 12px; display: flex; gap: 8px; align-items: center; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.search-wrap { flex: 1; position: relative; }
.search-wrap input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 36px 9px 10px; font-size: 15px; background: var(--surface2); color: var(--text); font-family: inherit; direction: rtl; -webkit-appearance: none; }
.search-icon { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--muted); pointer-events: none; }
.sort-btn { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; font-size: 12px; background: var(--surface2); color: var(--muted); cursor: pointer; white-space: nowrap; font-family: inherit; }
.sort-btn.active { background: var(--green-light); color: var(--green); border-color: var(--green-mid); }

/* Stats */
.stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; background: var(--surface2); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.stat-val { font-size: 20px; font-weight: 600; color: var(--text); }

/* List */
.list-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.record-item { background: var(--surface); margin: 8px 10px; border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 14px 16px; cursor: pointer; }
.rec-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.rec-name { font-size: 16px; font-weight: 600; color: var(--text); }
.rec-id { font-size: 11px; color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 3px 9px; }
.rec-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
.badge-green { background: var(--green-light); color: var(--green); }
.badge-amber { background: var(--amber-light); color: var(--amber); }

/* Modal Styles */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
.modal { background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; width: 100%; max-width: 480px; max-height: 93vh; overflow-y: auto; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
