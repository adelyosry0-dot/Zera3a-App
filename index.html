<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3B6D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الحيازات">
<title>سجل الحيازات الزراعية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #3B6D11; --green-light: #EAF3DE; --green-mid: #639922;
  --amber: #BA7517; --amber-light: #FAEEDA;
  --red: #A32D2D; --red-light: #FCEBEB;
  --blue: #185FA5; --blue-light: #E6F1FB;
  --surface: #ffffff; --surface2: #f5f5f0;
  --border: rgba(0,0,0,0.12); --text: #1a1a1a; --muted: #666;
  --radius: 10px; --radius-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1c1e; --surface2: #2c2c2e;
    --border: rgba(255,255,255,0.12); --text: #f0f0f0; --muted: #aaa;
    --green-light: #1a2e0a; --amber-light: #2a1e08;
    --red-light: #2e0f0f; --blue-light: #0a1e35;
  }
}
html, body { height: 100%; background: var(--surface2); font-family: -apple-system, 'Segoe UI', Arial, sans-serif; color: var(--text); }
#app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--surface2); }

/* Header */
.header { background: var(--green); color: #fff; padding: 16px 16px 12px; padding-top: max(16px, env(safe-area-inset-top)); flex-shrink: 0; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.header h1 { font-size: 18px; font-weight: 600; }
.header-sub { font-size: 12px; opacity: 0.8; }
.header-btns { display: flex; gap: 8px; }
.btn-add { background: #fff; color: var(--green); border: none; border-radius: var(--radius); padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-excel { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.5); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
.btn-excel:active { background: rgba(255,255,255,0.3); }

/* Toolbar */
.toolbar { background: var(--surface); padding: 10px 12px; display: flex; gap: 8px; align-items: center; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.search-wrap { flex: 1; position: relative; }
.search-wrap input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 36px 9px 10px; font-size: 15px; background: var(--surface2); color: var(--text); font-family: inherit; direction: rtl; -webkit-appearance: none; }
.search-wrap input:focus { outline: none; border-color: var(--green-mid); background: var(--surface); }
.search-icon { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--muted); pointer-events: none; }
.sort-btn { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; font-size: 12px; background: var(--surface2); color: var(--muted); cursor: pointer; white-space: nowrap; font-family: inherit; }
.sort-btn.active { background: var(--green-light); color: var(--green); border-color: var(--green-mid); }

/* Stats */
.stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; background: var(--surface2); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.stat-val { font-size: 20px; font-weight: 600; color: var(--text); }

/* List */
.list-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.record-item { background: var(--surface); margin: 8px 10px; border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 14px 16px; cursor: pointer; transition: transform 0.1s, opacity 0.1s; }
.record-item:active { opacity: 0.7; transform: scale(0.98); }
.rec-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.rec-name { font-size: 16px; font-weight: 600; color: var(--text); }
.rec-id { font-size: 11px; color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 3px 9px; }
.rec-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
.badge-green { background: var(--green-light); color: var(--green); }
.badge-amber { background: var(--amber-light); color: var(--amber); }
.badge-blue { background: var(--blue-light); color: var(--blue); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; line-height: 2; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
.modal { background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; width: 100%; max-width: 480px; max-height: 93vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 12px; border-bottom: 0.5px solid var(--border); }
.modal-title { font-size: 17px; font-weight: 600; color: var(--text); }
.modal-close { background: var(--surface2); border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 18px; }
.field-group { margin-bottom: 16px; }
.field-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.field-input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; font-size: 16px; background: var(--surface2); color: var(--text); font-family: inherit; direction: rtl; -webkit-appearance: none; }
.field-input:focus { outline: none; border-color: var(--green-mid); background: var(--surface); box-shadow: 0 0 0 3px rgba(99,153,34,0.15); }
.field-input[readonly] { opacity: 0.6; }
.area-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.area-unit { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 5px; font-weight: 500; }
.modal-footer { padding: 0 18px; display: flex; gap: 10px; }
.btn-primary { flex: 1; background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-primary:active { background: var(--green-mid); }
.btn-danger-outline { background: var(--red-light); color: var(--red); border: 1px solid var(--red); border-radius: var(--radius); padding: 13px 16px; font-size: 15px; cursor: pointer; font-family: inherit; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 16px; font-size: 15px; cursor: pointer; font-family: inherit; }

/* Detail */
.detail-hero { background: var(--green-light); border-radius: var(--radius-lg); margin-bottom: 16px; padding: 20px; text-align: center; }
.detail-hero-id { font-size: 12px; color: var(--green); margin-bottom: 4px; font-weight: 500; }
.detail-hero-name { font-size: 22px; font-weight: 700; color: var(--green); }
.detail-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.detail-table tr td { padding: 11px 0; border-bottom: 0.5px solid var(--border); }
.detail-table td:first-child { color: var(--muted); }
.detail-table td:last-child { text-align: left; font-weight: 600; }
.detail-actions { display: flex; gap: 8px; margin-top: 18px; }
.btn-copy { flex: 1; background: var(--blue-light); color: var(--blue); border: 1px solid var(--blue); border-radius: var(--radius); padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 500; }
.btn-edit { flex: 2; background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; }
.btn-del { background: var(--red-light); color: var(--red); border: 1px solid var(--red); border-radius: var(--radius); padding: 11px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }

/* Confirm */
.confirm-box { text-align: center; padding: 10px 0 18px; }
.confirm-icon { font-size: 48px; margin-bottom: 10px; }
.confirm-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.confirm-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
.confirm-btns { display: flex; gap: 10px; margin-top: 22px; }

/* Excel Modal */
.excel-section { background: var(--surface2); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; }
.excel-section-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.excel-section-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface); }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--green-mid); background: var(--green-light); }
.drop-zone-icon { font-size: 36px; margin-bottom: 8px; }
.drop-zone-text { font-size: 14px; color: var(--muted); }
.drop-zone-hint { font-size: 12px; color: var(--muted); margin-top: 4px; opacity: 0.7; }
#file-input { display: none; }
.import-preview { margin-top: 12px; }
.preview-title { font-size: 13px; font-weight: 600; color: var(--green); margin-bottom: 8px; }
.preview-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 0.5px solid var(--border); }
.preview-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 320px; }
.preview-table th { background: var(--green); color: #fff; padding: 8px 10px; text-align: right; font-weight: 600; white-space: nowrap; }
.preview-table td { padding: 7px 10px; border-bottom: 0.5px solid var(--border); text-align: right; }
.preview-table tr:last-child td { border-bottom: none; }
.preview-table tr:nth-child(even) td { background: var(--surface2); }
.preview-row-new td:first-child::before { content: '✚'; color: var(--green); font-size: 10px; margin-left: 4px; }
.preview-row-update td:first-child::before { content: '✎'; color: var(--amber); font-size: 10px; margin-left: 4px; }
.preview-row-skip td:first-child::before { content: '⚠'; color: var(--red); font-size: 10px; margin-left: 4px; }
.preview-legend { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.badge-new { background: var(--green-light); color: var(--green); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-update { background: var(--amber-light); color: var(--amber); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-skip { background: var(--red-light); color: var(--red); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.import-counts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.count-card { background: var(--surface); border-radius: var(--radius); padding: 10px; text-align: center; border: 0.5px solid var(--border); }
.count-num { font-size: 20px; font-weight: 700; }
.count-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
.btn-download-template { width: 100%; background: var(--green-light); color: var(--green); border: 1px solid var(--green-mid); border-radius: var(--radius); padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; }
.btn-download-template:active { background: var(--green-mid); color: #fff; }
.btn-import-confirm { width: 100%; background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 12px; }
.btn-import-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
.import-error { background: var(--red-light); color: var(--red); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; margin-top: 10px; line-height: 1.6; border: 0.5px solid var(--red); }
.col-map-info { background: var(--blue-light); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--blue); margin-top: 10px; line-height: 1.8; border: 0.5px solid var(--blue); }

/* Toast */
.toast { position: fixed; bottom: max(32px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 14px; z-index: 999; white-space: nowrap; animation: fadeInOut 2.5s ease forwards; }
@keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(10px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>سجل الحيازات الزراعية</h1>
        <div class="header-sub" id="header-sub">جاري التحميل...</div>
      </div>
      <div class="header-btns">
        <button class="btn-excel" onclick="openExcelModal()">📊 إكسيل</button>
        <button class="btn-add" onclick="openAdd()">+ إضافة</button>
      </div>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" placeholder="بحث بالاسم أو الرقم أو الحوض..." oninput="renderList()" />
    </div>
    <button class="sort-btn" id="sort-name-btn" onclick="toggleSort('name')">الاسم</button>
    <button class="sort-btn" id="sort-area-btn" onclick="toggleSort('area')">المساحة</button>
  </div>
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">إجمالي السجلات</div>
      <div class="stat-val" id="stat-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">إجمالي المساحة (فدان)</div>
      <div class="stat-val" id="stat-area">0</div>
    </div>
  </div>
  <div class="list-wrap" id="list-wrap"></div>
</div>
<div id="modal-root"></div>
<input type="file" id="file-input" accept=".xlsx,.xls" onchange="handleFileSelect(event)" />

<script>
let db = JSON.parse(localStorage.getItem('hiyazat_v2') || '[]');
let sortBy = null, sortDir = 1, editId = null;
let importPreviewData = [];

function save() { localStorage.setItem('hiyazat_v2', JSON.stringify(db)); }
function areaToFeddan(f,q,s){ return (parseFloat(f)||0)+(parseFloat(q)||0)/24+(parseFloat(s)||0)/576; }
function fmtArea(f,q,s){ let p=[]; if(+f)p.push(f+' فدان'); if(+q)p.push(q+' قيراط'); if(+s)p.push(s+' سهم'); return p.length?p.join(' '):'—'; }
function fmtTotal(f,q,s){ return areaToFeddan(f,q,s).toFixed(3); }
function genId(){ const m=db.reduce((a,r)=>Math.max(a,parseInt(r.id)||0),0); return String(m+1).padStart(4,'0'); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

function updateStats(){
  document.getElementById('stat-count').textContent=db.length;
  const tot=db.reduce((a,r)=>a+areaToFeddan(r.feddan,r.qirat,r.sahm),0);
  document.getElementById('stat-area').textContent=tot.toFixed(2);
  document.getElementById('header-sub').textContent=db.length+' حيازة مسجلة';
}

function getFiltered(){
  const q=(document.getElementById('search-input').value||'').trim().toLowerCase();
  let list=db.slice();
  if(q) list=list.filter(r=>r.name.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)||(r.basin||'').toLowerCase().includes(q));
  if(sortBy==='name') list.sort((a,b)=>sortDir*a.name.localeCompare(b.name,'ar'));
  if(sortBy==='area') list.sort((a,b)=>sortDir*(areaToFeddan(a.feddan,a.qirat,a.sahm)-areaToFeddan(b.feddan,b.qirat,b.sahm)));
  return list;
}

function toggleSort(key){
  sortBy===key? sortDir*=-1 : (sortBy=key, sortDir=1);
  document.getElementById('sort-name-btn').classList.toggle('active',sortBy==='name');
  document.getElementById('sort-area-btn').classList.toggle('active',sortBy==='area');
  renderList();
}

function renderList(){
  const wrap=document.getElementById('list-wrap');
  const list=getFiltered();
  updateStats();
  if(!list.length){ wrap.innerHTML='<div class="empty-state">🌾<br>لا توجد نتائج<br><span style="font-size:13px">اضغط + إضافة لإنشاء أول حيازة</span></div>'; return; }
  wrap.innerHTML=list.map(r=>`
    <div class="record-item" onclick="openDetail('${r.id}')">
      <div class="rec-top"><span class="rec-name">${r.name}</span><span class="rec-id">#${r.id}</span></div>
      <div class="rec-meta">
        <span class="badge badge-green">${fmtArea(r.feddan,r.qirat,r.sahm)}</span>
        <span class="badge badge-amber">${r.basin||'—'}</span>
      </div>
    </div>`).join('');
}

function showFormModal(rec){
  const isEdit=!!rec;
  document.getElementById('modal-root').innerHTML=`
    <div class="modal-backdrop" onclick="bgClose(event)">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <span class="modal-title">${isEdit?'تعديل الحيازة':'إضافة حيازة جديدة'}</span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="field-group">
            <div class="field-label">رقم الحيازة</div>
            <input class="field-input" id="f-id" type="text" value="${isEdit?rec.id:genId()}" ${isEdit?'readonly':''} />
          </div>
          <div class="field-group">
            <div class="field-label">اسم الحائز *</div>
            <input class="field-input" id="f-name" type="text" value="${isEdit?rec.name:''}" placeholder="الاسم الكامل للحائز" />
          </div>
          <div class="field-group">
            <div class="field-label">اسم الحوض *</div>
            <input class="field-input" id="f-basin" type="text" value="${isEdit?rec.basin:''}" placeholder="اسم الحوض الزراعي" />
          </div>
          <div class="field-group">
            <div class="field-label">المساحة</div>
            <div class="area-row">
              <div><div class="area-unit">فدان</div><input class="field-input" id="f-fed" type="number" min="0" value="${isEdit?rec.feddan:0}" /></div>
              <div><div class="area-unit">قيراط</div><input class="field-input" id="f-qir" type="number" min="0" max="23" value="${isEdit?rec.qirat:0}" /></div>
              <div><div class="area-unit">سهم</div><input class="field-input" id="f-sahm" type="number" min="0" max="23" value="${isEdit?rec.sahm:0}" /></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
          <button class="btn-primary" onclick="saveRecord()">✓ حفظ</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{ const n=document.getElementById('f-name'); if(n&&!isEdit)n.focus(); },300);
}

function saveRecord(){
  const id=document.getElementById('f-id').value.trim();
  const name=document.getElementById('f-name').value.trim();
  const basin=document.getElementById('f-basin').value.trim();
  const feddan=document.getElementById('f-fed').value||'0';
  const qirat=document.getElementById('f-qir').value||'0';
  const sahm=document.getElementById('f-sahm').value||'0';
  if(!name||!basin){ toast('⚠️ يرجى تعبئة الاسم والحوض'); return; }
  if(!editId){
    if(db.find(r=>r.id===id)){ toast('⚠️ رقم الحيازة موجود مسبقاً'); return; }
    db.push({id,name,basin,feddan,qirat,sahm,created:new Date().toISOString()});
  } else {
    const idx=db.findIndex(r=>r.id===editId);
    db[idx]={...db[idx],name,basin,feddan,qirat,sahm,updated:new Date().toISOString()};
  }
  save(); closeModal(); renderList(); toast(editId?'✓ تم التعديل':'✓ تمت الإضافة');
}

function openAdd(){ editId=null; showFormModal(null); }
function openEdit(id){ editId=id; showFormModal(db.find(r=>r.id===id)); closeModal(); }

function openDetail(id){
  const rec=db.find(r=>r.id===id); if(!rec)return;
  const created=rec.created?new Date(rec.created).toLocaleDateString('ar-EG'):'—';
  document.getElementById('modal-root').innerHTML=`
    <div class="modal-backdrop" onclick="bgClose(event)">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <span class="modal-title">تفاصيل الحيازة</span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="detail-hero">
            <div class="detail-hero-id">رقم الحيازة: ${rec.id}</div>
            <div class="detail-hero-name">${rec.name}</div>
          </div>
          <table class="detail-table">
            <tr><td>اسم الحوض</td><td>${rec.basin||'—'}</td></tr>
            <tr><td>الفدان</td><td>${rec.feddan||0}</td></tr>
            <tr><td>القيراط</td><td>${rec.qirat||0}</td></tr>
            <tr><td>السهم</td><td>${rec.sahm||0}</td></tr>
            <tr><td>الإجمالي (فدان)</td><td>${fmtTotal(rec.feddan,rec.qirat,rec.sahm)}</td></tr>
            <tr><td>تاريخ الإضافة</td><td>${created}</td></tr>
          </table>
          <div class="detail-actions">
            <button class="btn-copy" onclick="copyRecord('${rec.id}')">📋 نسخ</button>
            <button class="btn-edit" onclick="openEdit('${rec.id}')">✏️ تعديل</button>
            <button class="btn-del" onclick="confirmDelete('${rec.id}')">🗑</button>
          </div>
        </div>
      </div>
    </div>`;
}

function copyRecord(id){
  const rec=db.find(r=>r.id===id);
  const txt=`رقم الحيازة: ${rec.id}\nاسم الحائز: ${rec.name}\nالحوض: ${rec.basin}\nالمساحة: ${fmtArea(rec.feddan,rec.qirat,rec.sahm)} (${fmtTotal(rec.feddan,rec.qirat,rec.sahm)} فدان)`;
  if(navigator.share){ navigator.share({title:'بيانات الحيازة',text:txt}).catch(()=>{}); }
  else { navigator.clipboard.writeText(txt).then(()=>toast('✓ تم النسخ')).catch(()=>toast(txt)); }
}

function confirmDelete(id){
  const rec=db.find(r=>r.id===id);
  document.getElementById('modal-root').innerHTML=`
    <div class="modal-backdrop">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-body">
          <div class="confirm-box">
            <div class="confirm-icon">⚠️</div>
            <div class="confirm-title">تأكيد الحذف</div>
            <div class="confirm-sub">هل أنت متأكد من حذف سجل<br><strong>${rec.name}</strong>؟<br>لا يمكن التراجع عن هذا الإجراء.</div>
            <div class="confirm-btns">
              <button class="btn-secondary" style="flex:1" onclick="openDetail('${id}')">رجوع</button>
              <button class="btn-danger-outline" style="flex:1" onclick="deleteRecord('${id}')">🗑 حذف نهائياً</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

function deleteRecord(id){ db=db.filter(r=>r.id!==id); save(); closeModal(); renderList(); toast('تم الحذف'); }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; importPreviewData=[]; }
function bgClose(e){ if(e.target.classList.contains('modal-backdrop')) closeModal(); }

// ========== EXCEL FUNCTIONS ==========

function downloadTemplate(){
  const wb = XLSX.utils.book_new();
  const headerRow = ['رقم الحيازة','اسم الحائز','اسم الحوض','فدان','قيراط','سهم'];
  const sampleData = [
    ['0001','أحمد محمد علي','حوض النيل الغربي',3,12,0],
    ['0002','فاطمة حسن إبراهيم','حوض الشرقية',1,18,6],
  ];
  const wsData = [headerRow, ...sampleData];
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // Column widths
  ws['!cols'] = [
    {wch:14},{wch:24},{wch:22},{wch:8},{wch:8},{wch:8}
  ];

  // Style header row (bold + green background)
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let C=range.s.c; C<=range.e.c; C++){
    const addr = XLSX.utils.encode_cell({r:0, c:C});
    if(!ws[addr]) continue;
    ws[addr].s = {
      font:{bold:true, color:{rgb:'FFFFFF'}},
      fill:{fgColor:{rgb:'3B6D11'}},
      alignment:{horizontal:'center'}
    };
  }

  XLSX.utils.book_append_sheet(wb, ws, 'الحيازات');
  XLSX.writeFile(wb, 'نموذج_الحيازات.xlsx');
  toast('✓ تم تنزيل النموذج');
}

function exportAll(){
  if(!db.length){ toast('⚠️ لا توجد بيانات للتصدير'); return; }
  const wb = XLSX.utils.book_new();
  const headerRow = ['رقم الحيازة','اسم الحائز','اسم الحوض','فدان','قيراط','سهم','الإجمالي (فدان)','تاريخ الإضافة'];
  const rows = db.map(r=>[
    r.id, r.name, r.basin||'',
    parseFloat(r.feddan)||0, parseFloat(r.qirat)||0, parseFloat(r.sahm)||0,
    parseFloat(fmtTotal(r.feddan,r.qirat,r.sahm)),
    r.created?new Date(r.created).toLocaleDateString('ar-EG'):''
  ]);
  const ws = XLSX.utils.aoa_to_sheet([headerRow,...rows]);
  ws['!cols']=[{wch:14},{wch:24},{wch:22},{wch:8},{wch:8},{wch:8},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws, 'الحيازات');
  XLSX.writeFile(wb, `الحيازات_${new Date().toLocaleDateString('ar-EG').replace(/\//g,'-')}.xlsx`);
  toast(`✓ تم تصدير ${db.length} حيازة`);
}

// Column name mappings (Arabic & English)
const COL_MAP = {
  id:     ['رقم الحيازة','رقم','id','رقم_الحيازة','رقم حيازه'],
  name:   ['اسم الحائز','اسم','name','الاسم','اسم_الحائز','اسم حائز'],
  basin:  ['اسم الحوض','حوض','basin','الحوض','اسم_الحوض','اسم حوض'],
  feddan: ['فدان','feddan','فدانات'],
  qirat:  ['قيراط','قراريط','qirat','qiraat'],
  sahm:   ['سهم','اسهم','sahm','سهام'],
};

function detectColumn(headers, key){
  const aliases = COL_MAP[key].map(a=>a.trim().toLowerCase());
  for(let i=0;i<headers.length;i++){
    const h = String(headers[i]||'').trim().toLowerCase();
    if(aliases.includes(h)) return i;
  }
  return -1;
}

function parseExcelFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data,{type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        resolve(rows);
      } catch(err){ reject(err); }
    };
    reader.onerror=()=>reject(new Error('فشل قراءة الملف'));
    reader.readAsArrayBuffer(file);
  });
}

function processImportRows(rows){
  if(!rows||rows.length<2) return {error:'الملف فارغ أو لا يحتوي على بيانات'};
  const headers = rows[0];
  const colId    = detectColumn(headers,'id');
  const colName  = detectColumn(headers,'name');
  const colBasin = detectColumn(headers,'basin');
  const colFed   = detectColumn(headers,'feddan');
  const colQir   = detectColumn(headers,'qirat');
  const colSahm  = detectColumn(headers,'sahm');

  if(colName===-1) return {error:'لم يُعثر على عمود "اسم الحائز".\nتأكد أن الصف الأول يحتوي على أسماء الأعمدة.'};
  if(colBasin===-1) return {error:'لم يُعثر على عمود "اسم الحوض".\nتأكد أن الصف الأول يحتوي على أسماء الأعمدة.'};

  const results=[];
  let nextId = db.reduce((a,r)=>Math.max(a,parseInt(r.id)||0),0)+1;

  for(let i=1;i<rows.length;i++){
    const row=rows[i];
    if(row.every(c=>String(c).trim()==='')) continue; // skip empty rows
    const name = String(row[colName]||'').trim();
    const basin = String(row[colBasin]||'').trim();
    const feddan = String(row[colFed]>=0?row[colFed]||0:0);
    const qirat = String(row[colQir]>=0?row[colQir]||0:0);
    const sahm = String(row[colSahm]>=0?row[colSahm]||0:0);

    if(!name){
      results.push({status:'skip',reason:'اسم فارغ',row:i+1,name:'—',basin,feddan,qirat,sahm,id:''});
      continue;
    }

    let id = colId>=0 ? String(row[colId]||'').trim() : '';
    if(!id) id = String(nextId++).padStart(4,'0');
    else id = id.padStart(4,'0');

    const existing = db.find(r=>r.id===id);
    if(existing){
      results.push({status:'update',id,name,basin,feddan,qirat,sahm,row:i+1});
    } else {
      results.push({status:'new',id,name,basin,feddan,qirat,sahm,row:i+1});
    }
  }
  return {results};
}

function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value='';
  parseExcelFile(file).then(rows=>{
    const {error,results} = processImportRows(rows);
    updateImportPreview(error, results);
  }).catch(err=>{
    updateImportPreview('خطأ في قراءة الملف: '+err.message, null);
  });
}

function updateImportPreview(error, results){
  const previewEl = document.getElementById('import-preview-area');
  if(!previewEl) return;

  if(error){
    previewEl.innerHTML=`<div class="import-error">❌ ${error}</div>`;
    importPreviewData=[];
    updateImportBtn();
    return;
  }

  importPreviewData = results;
  const newCount = results.filter(r=>r.status==='new').length;
  const updateCount = results.filter(r=>r.status==='update').length;
  const skipCount = results.filter(r=>r.status==='skip').length;

  const tableRows = results.slice(0,20).map(r=>`
    <tr class="preview-row-${r.status}">
      <td>${r.name}</td>
      <td>${r.basin}</td>
      <td>${fmtArea(r.feddan,r.qirat,r.sahm)}</td>
      <td><span class="badge ${r.status==='new'?'badge-new':r.status==='update'?'badge-update':'badge-skip'}">${r.status==='new'?'جديد':r.status==='update'?'تحديث':'تخطي'}</span></td>
    </tr>`).join('');

  previewEl.innerHTML=`
    <div class="import-counts">
      <div class="count-card"><div class="count-num" style="color:var(--green)">${newCount}</div><div class="count-lbl">جديد</div></div>
      <div class="count-card"><div class="count-num" style="color:var(--amber)">${updateCount}</div><div class="count-lbl">تحديث</div></div>
      <div class="count-card"><div class="count-num" style="color:var(--red)">${skipCount}</div><div class="count-lbl">تخطي</div></div>
    </div>
    <div class="import-preview" style="margin-top:12px">
      <div class="preview-title">${results.length>20?`أول 20 صف من ${results.length}`:results.length+' صف'}</div>
      <div class="preview-table-wrap">
        <table class="preview-table">
          <thead><tr><th>الاسم</th><th>الحوض</th><th>المساحة</th><th>الحالة</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`;
  updateImportBtn();
}

function updateImportBtn(){
  const btn = document.getElementById('btn-import-confirm');
  if(!btn) return;
  const valid = importPreviewData.filter(r=>r.status!=='skip').length;
  btn.disabled = valid===0;
  btn.textContent = valid>0?`✓ استيراد ${valid} حيازة`:'لا توجد بيانات صالحة';
}

function confirmImport(){
  if(!importPreviewData.length) return;
  let added=0, updated=0;
  importPreviewData.forEach(r=>{
    if(r.status==='skip') return;
    if(r.status==='new'){
      db.push({id:r.id,name:r.name,basin:r.basin,feddan:r.feddan,qirat:r.qirat,sahm:r.sahm,created:new Date().toISOString()});
      added++;
    } else {
      const idx=db.findIndex(x=>x.id===r.id);
      if(idx>=0){ db[idx]={...db[idx],name:r.name,basin:r.basin,feddan:r.feddan,qirat:r.qirat,sahm:r.sahm,updated:new Date().toISOString()}; updated++; }
    }
  });
  save(); closeModal(); renderList();
  toast(`✓ تمت الإضافة: ${added} | التحديث: ${updated}`);
}

function openExcelModal(){
  document.getElementById('modal-root').innerHTML=`
    <div class="modal-backdrop" onclick="bgClose(event)">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <span class="modal-title">📊 استيراد / تصدير إكسيل</span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">

          <!-- Import Section -->
          <div class="excel-section">
            <div class="excel-section-title">📥 استيراد من إكسيل</div>
            <div class="excel-section-desc">ارفع ملف Excel يحتوي على بيانات الحيازات.<br>النظام سيتعرف تلقائياً على الأعمدة ويعرض معاينة قبل الاستيراد.</div>
            <div class="col-map-info">
              📋 أسماء الأعمدة المقبولة:<br>
              <strong>رقم الحيازة</strong> · <strong>اسم الحائز</strong> · <strong>اسم الحوض</strong><br>
              <strong>فدان</strong> · <strong>قيراط</strong> · <strong>سهم</strong>
            </div>
            <div class="drop-zone" id="drop-zone" style="margin-top:12px"
              onclick="document.getElementById('file-input').click()"
              ondragover="event.preventDefault();this.classList.add('drag-over')"
              ondragleave="this.classList.remove('drag-over')"
              ondrop="this.classList.remove('drag-over');handleDrop(event)">
              <div class="drop-zone-icon">📂</div>
              <div class="drop-zone-text">اضغط لاختيار ملف أو اسحب هنا</div>
              <div class="drop-zone-hint">.xlsx أو .xls</div>
            </div>
            <div id="import-preview-area"></div>
            <button class="btn-import-confirm" id="btn-import-confirm" disabled onclick="confirmImport()">استيراد</button>
          </div>

          <!-- Template Download -->
          <div class="excel-section">
            <div class="excel-section-title">📄 تنزيل النموذج</div>
            <div class="excel-section-desc">تنزيل ملف Excel فارغ بالتنسيق الصحيح لملء البيانات.</div>
            <button class="btn-download-template" onclick="downloadTemplate()">⬇️ تنزيل نموذج Excel</button>
          </div>

          <!-- Export Section -->
          <div class="excel-section">
            <div class="excel-section-title">📤 تصدير البيانات</div>
            <div class="excel-section-desc">تصدير جميع الحيازات المسجلة (${db.length} حيازة) إلى ملف Excel.</div>
            <button class="btn-download-template" onclick="exportAll()" style="background:var(--blue-light);color:var(--blue);border-color:var(--blue)">⬆️ تصدير كل الحيازات</button>
          </div>

        </div>
      </div>
    </div>`;
}

function handleDrop(e){
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(!file) return;
  if(!file.name.match(/\.xlsx?$/i)){ toast('⚠️ يرجى رفع ملف Excel (.xlsx أو .xls)'); return; }
  parseExcelFile(file).then(rows=>{
    const {error,results}=processImportRows(rows);
    updateImportPreview(error,results);
  }).catch(err=>updateImportPreview('خطأ: '+err.message,null));
}
