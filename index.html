<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @media print {
            body {
                -webkit-print-color-adjust: exact;
                color-adjust: exact;
                margin: 0;
            }
            .print-button {
                display: none;
            }
            .page-number {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                text-align: center;
            }
            table {
                page-break-inside: auto;
                width: 100%;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            th {
                background: #f2f2f2;
                position: -webkit-sticky;
                position: sticky;
                top: 0;
            }
        }
    </style>
    <script>
        function printPage() {
            const printContent = document.getElementById('printableArea');
            const win = window.open('', '', 'width=900,height=700');
            win.document.write('<html><head><title>Print</title>');
            win.document.write('<link rel="stylesheet" href="style.css" type="text/css">');
            win.document.write('</head><body>');
            win.document.write(printContent.innerHTML);
            win.document.write('<div class="page-number">صفحة ' + (1) + ' من ' + (document.getElementsByTagName('tr').length / 25) + '</div>');
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        }
    </script>
</head>
<body>
    <header>
        <button class="print-button" onclick="printPage()">🖨️ طباعة</button>
    </header>
    <div id="printableArea">
        <table>
            <thead>
                <tr>
                    <th>رقم الحيازة</th>
                    <th>اسم الحائز</th>
                    <th>اسم الحوض</th>
                    <th>فدان</th>
                    <th>قيراط</th>
                    <th>سهم</th>
                    <th>الإجمالي</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populate this section with your data -->
            </tbody>
        </table>
    </div>
</body>
</html>
